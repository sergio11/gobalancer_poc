server:
  port: 8080
  logLevel: info

loadBalancer:
  algorithm: round-robin

healthCheck:
  interval: 5s
  timeout: 2s
  maxFailures: 3

rateLimit:
  rate: 5000
  capacity: 10000
  enabled: true
  trustForwardedHeaders: false

admin:
  secret: ""

backends:
  - url: http://localhost:9001
    weight: 5
  - url: http://localhost:9002
    weight: 3
  - url: http://localhost:9003
    weight: 1
