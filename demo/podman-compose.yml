version: "3.8"

services:
  gobalancer:
    build:
      context: ..
      dockerfile: demo/Dockerfile.lb
    container_name: gobalancer
    ports:
      - "8080:8080"
    volumes:
      - ./configs/config-roundrobin.yaml:/app/configs/config.yaml:ro
    networks:
      - gobal-network
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  backend-1:
    build:
      context: ./backend
    container_name: backend-1
    volumes:
      - ./backends/backend-1:/usr/share/nginx/html:ro
    networks:
      - gobal-network
    restart: unless-stopped

  backend-2:
    build:
      context: ./backend
    container_name: backend-2
    volumes:
      - ./backends/backend-2:/usr/share/nginx/html:ro
    networks:
      - gobal-network
    restart: unless-stopped

  backend-3:
    build:
      context: ./backend
    container_name: backend-3
    volumes:
      - ./backends/backend-3:/usr/share/nginx/html:ro
    networks:
      - gobal-network
    restart: unless-stopped

networks:
  gobal-network:
    driver: bridge
